<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Difference in Your Photos</title>
<meta name="theme-color" content="#1B2A6B">
<link rel="icon" type="image/png" href="img/logo-192.png">
<link rel="apple-touch-icon" href="img/logo-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:root {
  --bg: #F1F3F8; --surface: #FFFFFF; --surface-2: #E7EBF3; --fg: #111827; --muted: #566079;
  --line: #D3DAE8; --accent: #2D55F5; --on-accent: #FFFFFF; --accent-soft: #E3E9FF;
  --chip-bg: rgba(8, 12, 22, 0.72); --chip-fg: #FFFFFF; --danger: #C0352B;
  --f-display: 'Bricolage Grotesque', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0F17; --surface: #131925; --surface-2: #1B2333; --fg: #E9EEF8; --muted: #97A3BC;
    --line: #242E45; --accent: #7C98FF; --on-accent: #0B0F17; --accent-soft: #1B2547; --danger: #FF8A80;
  }
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.wrap { max-width: 1120px; margin-inline: auto; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); letter-spacing: -0.015em; }
a { color: inherit; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font: 600 15px/1.2 var(--f-body); text-decoration: none; cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn-ai { border-color: var(--accent); color: var(--accent); background: transparent; }
.btn-ai:hover { background: var(--accent-soft); }
.btn-ghost { background: transparent; }
.btn-pro { background: linear-gradient(135deg, #FF9800, #F57C00); color: #FFF; border: none; font-weight: 700; }

.top { display: flex; align-items: center; gap: 12px; padding-block: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font: 800 clamp(15px, 4.2vw, 19px)/1.1 var(--f-display); text-decoration: none; }
.brand img { width: 38px; height: 38px; border-radius: 10px; }
.nav { margin-left: auto; display: none; gap: 4px; }
.nav a { padding: 8px 12px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 15px; }
.nav a:hover { color: var(--fg); background: var(--surface-2); }
.user-bar { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.user-avatar { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent); }
.badge-tier { font: 700 11px var(--f-mono); padding: 3px 8px; border-radius: 6px; text-transform: uppercase; }
.badge-free { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.badge-pro-user { background: #FFF3E0; color: #E65100; border: 1px solid #FFE0B2; }
.icon-btn { width: 44px; height: 44px; padding: 0; }
@media (min-width: 760px) { .nav { display: flex; } }

.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; padding-top: 20px; }
@media (min-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: start; }
  .viewer { position: sticky; top: 16px; }
}
.intro { display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: clamp(34px, 6.2vw, 58px); line-height: 1.03; font-weight: 800; }
h1 .hd { color: var(--accent); }
.lead { color: var(--muted); max-width: 52ch; font-size: 17px; }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--fg); font-size: 15px; }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0; margin: 0; list-style: none; font: 500 12px/1.4 var(--f-mono); color: var(--muted); text-transform: uppercase; }

.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.slot { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.slot-head { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.step { width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 700 12px var(--f-mono); }
.slot-head h3 { font-size: 16px; font-weight: 700; }
.slot-head .clear { margin-left: auto; border: 0; background: none; color: var(--muted); font: 600 13px var(--f-body); cursor: pointer; text-decoration: underline; }
.drop {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-height: 190px; padding: 12px; text-align: center; cursor: pointer;
  border: 1.5px dashed var(--line); border-radius: 12px; background: var(--bg); color: var(--muted);
}
.drop.has { border-style: solid; }
.thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.drop-meta { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; flex-direction: column; gap: 1px; padding: 6px 8px; border-radius: 8px; background: var(--chip-bg); color: var(--chip-fg); font: 500 11px var(--f-mono); text-align: left; }
.drop-meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions .btn-primary { flex: 1 1 100%; font-size: 16px; min-height: 48px; }
.hint { font-size: 14px; color: var(--muted); }
.hint.err { color: var(--danger); }

.viewer { display: flex; flex-direction: column; gap: 12px; }
.viewer-head { display: flex; align-items: center; gap: 10px; }
.viewer-head h2 { font-size: 22px; font-weight: 700; }
.pill { font: 500 11px/1 var(--f-mono); text-transform: uppercase; padding: 6px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.cmp {
  --pos: 50%; --ar: 0.564;
  position: relative; width: min(100%, calc(78vh * var(--ar))); aspect-ratio: var(--ar);
  margin-inline: auto; overflow: hidden; border-radius: 12px; background: var(--surface-2);
  touch-action: pan-y; cursor: ew-resize; user-select: none;
}
.cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
.before-clip { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
.divider { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 14px rgba(0,0,0,0.4); pointer-events: none; }
.knob {
  position: absolute; top: 50%; left: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
  background: #fff; color: #111827; display: grid; place-items: center; cursor: grab;
  box-shadow: 0 2px 12px rgba(0,0,0,0.45);
}
.chip { position: absolute; top: 12px; padding: 6px 10px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-fg); font: 500 12px/1 var(--f-mono); text-transform: uppercase; pointer-events: none; }
.chip-l { left: 12px; } .chip-r { right: 12px; }
.viewer-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 44px; padding: 8px 14px; border: 0; background: transparent; color: var(--fg); font: 600 14px var(--f-body); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.viewer-note { font-size: 14px; color: var(--muted); text-align: center; }

section.block { padding-top: 72px; }
.sec-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; max-width: 62ch; }
.sec-head h2 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; }
.sec-head p { color: var(--muted); }
.tag { align-self: flex-start; font: 500 11px/1 var(--f-mono); text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 9px; }

.tools { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 900px) { .tools { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
.card { display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.card h3 { font-size: 22px; font-weight: 700; }
.card > p { color: var(--muted); font-size: 15px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lab { font: 600 14px var(--f-body); display: flex; justify-content: space-between; }
.field input[type="range"] { width: 100%; accent-color: var(--accent); }
.hd-row { display: flex; flex-wrap: wrap; gap: 8px; }
.hd-out { display: flex; flex-direction: column; gap: 10px; }
.hd-out canvas { display: block; max-width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.hd-pick { min-height: 56px; border: 1.5px dashed var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); font: 600 15px var(--f-body); cursor: pointer; padding: 10px 14px; text-align: left; }
.links { display: flex; flex-direction: column; gap: 8px; }
.links a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); text-decoration: none; }
.links a b { font-weight: 700; display: flex; justify-content: space-between; }
.links a span { color: var(--muted); font-size: 14px; }
.links .sub { font: 500 11px var(--f-mono); text-transform: uppercase; color: var(--muted); margin-top: 6px; }

.shot { margin: 0; display: flex; flex-direction: column; gap: 8px; }
.shot button { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface-2); cursor: zoom-in; }
.shot img { display: block; width: 100%; height: auto; }
.shot figcaption { font-size: 14px; color: var(--muted); }
.shot figcaption b { color: var(--fg); font-weight: 600; }
.g-pair { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 16px; }
.g-hd { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.g-hd .shot img { aspect-ratio: 4 / 5; object-fit: cover; }
@media (max-width: 640px) { .g-pair { grid-template-columns: minmax(0, 1fr); } }

.promo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 520px) { .promo { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 900px) { .promo { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.app { display: flex; flex-direction: column; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-decoration: none; }
.app .kind { font: 500 11px var(--f-mono); text-transform: uppercase; color: var(--accent); }
.app h3 { font-size: 22px; font-weight: 700; }
.app p { color: var(--muted); font-size: 15px; flex: 1; }
.app .go { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }

.ai { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 28px 20px; border-radius: 16px; background: var(--surface-2); }
@media (min-width: 820px) { .ai { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); padding: 36px; align-items: center; } }
.ai h2 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; margin-bottom: 10px; }
.ai p { color: var(--muted); max-width: 48ch; margin-bottom: 18px; }
.prompts { display: flex; flex-direction: column; gap: 8px; }
.prompts small { font: 500 11px var(--f-mono); text-transform: uppercase; color: var(--muted); }
.prompts button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); font: 500 16px var(--f-body); cursor: pointer; }

.faq { display: flex; flex-direction: column; border-top: 1px solid var(--line); max-width: 760px; }
.faq details { border-bottom: 1px solid var(--line); }
.faq summary { cursor: pointer; padding: 16px 0; font: 700 18px var(--f-display); list-style: none; display: flex; justify-content: space-between; }
.faq details p { padding: 0 0 16px; color: var(--muted); max-width: 62ch; }

footer { margin-top: 72px; padding-top: 20px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px 24px; justify-content: space-between; color: var(--muted); font-size: 14px; }

.fab { position: fixed; z-index: 40; right: 16px; bottom: 16px; display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 18px 0 14px; border: 0; border-radius: 999px; background: var(--accent); color: var(--on-accent); font: 700 15px var(--f-body); cursor: pointer; box-shadow: 0 8px 24px rgba(10, 20, 60, 0.35); }
.chat { position: fixed; z-index: 45; right: 16px; bottom: 16px; width: min(400px, calc(100vw - 32px)); height: min(620px, calc(100vh - 32px)); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 16px 48px rgba(5, 10, 30, 0.35); }
@media (max-width: 520px) { .chat { left: 0; right: 0; bottom: 0; width: 100%; height: 85vh; border-radius: 16px 16px 0 0; } }
.chat-head { display: flex; align-items: center; gap: 10px; padding: 12px; border-bottom: 1px solid var(--line); }
.chat-head img { width: 36px; height: 36px; border-radius: 10px; }
.chat-head .who { flex: 1; }
.chat-head button { width: 40px; height: 40px; border: 0; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }

.chat-limits { padding: 8px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.limit-bar { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
.limit-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
.reset-info { font-size: 10px; color: var(--muted); font-family: var(--f-mono); }

.chat-log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 86%; padding: 10px 13px; border-radius: 14px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; }
.msg.bot { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }

.chat-form { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.chat-form textarea { flex: 1; resize: none; max-height: 112px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); font: 400 16px var(--f-body); }
.chat-form button { width: 46px; height: 46px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); cursor: pointer; display: grid; place-items: center; }
.chat-form .chat-photo-btn, .chat-form .chat-mic-btn { background: var(--surface-2); color: var(--fg); }

.voice-panel { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.vp-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.vp-chips button { min-height: 34px; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--fg); font: 600 12px var(--f-body); cursor: pointer; }
.vp-chips button[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

.call { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column; align-items: center; justify-content: space-between; padding: 24px 20px; background: linear-gradient(180deg, #0f1a45, #0b1022 70%); color: #fff; }
.call-avatar img { width: 120px; height: 120px; border-radius: 28px; }
.call-btns { display: flex; gap: 20px; }
.cb { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 72px; padding: 14px 10px; border: 0; border-radius: 22px; background: rgba(255,255,255,.12); color: #fff; cursor: pointer; }
.cb.end { background: #e5484d; }

.modal { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-box { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 24px; width: min(100%, 420px); display: flex; flex-direction: column; gap: 16px; }
.auth-form { display: flex; flex-direction: column; gap: 12px; }
.auth-field { display: flex; flex-direction: column; gap: 6px; }
.auth-field input { padding: 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
.btn-google { background: var(--surface); border: 1px solid var(--line); color: var(--fg); width: 100%; font-weight: 600; }

.lb { position: fixed; inset: 0; z-index: 50; background: rgba(5, 8, 14, 0.93); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 40px 16px; }
.lb img { max-width: 100%; max-height: calc(100vh - 120px); object-fit: contain; border-radius: 8px; }
.lb-close { position: absolute; top: 16px; right: 16px; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255,255,255,0.14); color: #fff; cursor: pointer; }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#top">
      <img src="img/logo-192.png" width="38" height="38" alt="">
      The Difference in Your Photos
    </a>
    <nav class="nav">
      <a href="#alat-hd">Alat HD</a>
      <a href="#contoh">Contoh</a>
      <a href="#promo">Promosi</a>
      <a href="#ai" data-open-chat>Faisal AI</a>
      <a href="#faq">FAQ</a>
    </nav>
    <div class="user-bar">
      <div id="auth-unlogged">
        <button class="btn btn-primary" id="btn-open-login" type="button">Masuk</button>
      </div>
      <div id="auth-logged" hidden style="display: flex; align-items: center; gap: 8px;">
        <span class="badge-tier badge-free" id="badge-tier">FREE</span>
        <button class="btn btn-pro" id="btn-open-pro" type="button" style="min-height:34px; padding:4px 10px; font-size:12px;">PRO (10k)</button>
        <img class="user-avatar" id="user-avatar" src="img/logo-192.png" alt="User">
        <button class="btn btn-ghost" id="btn-logout" type="button" style="min-height: 34px; padding: 4px 8px; font-size: 13px;">Keluar</button>
