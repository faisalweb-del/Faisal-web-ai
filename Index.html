<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Difference in Your Photos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Bandingkan foto sebelum dan sesudah untuk melihat seberapa HD fotomu. Hanya untuk melihat, bukan untuk memperbagus atau menaikkan resolusi.">
<meta name="theme-color" content="#1B2A6B">
<link rel="icon" type="image/png" href="img/logo-192.png">
<link rel="apple-touch-icon" href="img/logo-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: header, then two columns on desktop. Left = judul, slot upload, tombol. Right = viewer sebelum/sesudah yang menempel saat scroll. Di bawahnya: contoh HD, promosi, AI, FAQ. */
html { color-scheme: light; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
:root {
  --bg: #F1F3F8;
  --surface: #FFFFFF;
  --surface-2: #E7EBF3;
  --fg: #111827;
  --muted: #566079;
  --line: #D3DAE8;
  --accent: #2D55F5;
  --on-accent: #FFFFFF;
  --accent-soft: #E3E9FF;
  --chip-bg: rgba(8, 12, 22, 0.72);
  --chip-fg: #FFFFFF;
  --danger: #C0352B;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Figtree', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0F17; --surface: #131925; --surface-2: #1B2333; --fg: #E9EEF8; --muted: #97A3BC;
    --line: #242E45; --accent: #7C98FF; --on-accent: #0B0F17; --accent-soft: #1B2547; --danger: #FF8A80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0F17; --surface: #131925; --surface-2: #1B2333; --fg: #E9EEF8; --muted: #97A3BC;
  --line: #242E45; --accent: #7C98FF; --on-accent: #0B0F17; --accent-soft: #1B2547; --danger: #FF8A80;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--f-body); font-size: 16px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 40px;
}
.wrap { max-width: 1120px; margin-inline: auto; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; letter-spacing: -0.015em; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

/* tombol */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 10px 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  font: 600 15px/1.2 var(--f-body); text-decoration: none; cursor: pointer;
}
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--on-accent); border-color: transparent; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); border-color: transparent; }
.btn-ai { border-color: var(--accent); color: var(--accent); background: transparent; }
.btn-ai:hover { background: var(--accent-soft); }
.btn-ghost { background: transparent; }
.btn svg { flex: none; }

/* header */
.top { display: flex; align-items: center; gap: 12px; padding-block: 16px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; font: 800 clamp(15px, 4.2vw, 19px)/1.1 var(--f-display); letter-spacing: -0.02em; text-decoration: none; }
.brand img { flex: none; width: 38px; height: 38px; border-radius: 10px; display: block; }
.nav { margin-left: auto; display: none; gap: 4px; }
.nav a { padding: 8px 12px; border-radius: 8px; text-decoration: none; color: var(--muted); font-weight: 600; font-size: 15px; }
.nav a:hover { color: var(--fg); background: var(--surface-2); }
.icon-btn { margin-left: auto; width: 44px; height: 44px; padding: 0; }
.nav + .icon-btn { margin-left: 0; }
@media (min-width: 760px) { .nav { display: flex; } }

/* layout utama */
.main { display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; padding-top: 20px; }
@media (min-width: 900px) {
  .main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 48px; align-items: start; }
  .viewer { position: sticky; top: 16px; }
}
.intro { display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: clamp(34px, 6.2vw, 58px); line-height: 1.03; font-weight: 800; letter-spacing: -0.03em; }
h1 .hd { color: var(--accent); }
.lead { color: var(--muted); max-width: 52ch; font-size: 17px; }
.hero-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; }
.hero-actions .textlink { font-weight: 600; color: var(--muted); }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); color: var(--fg); font-size: 15px; max-width: 54ch; }
.note svg { flex: none; margin-top: 2px; color: var(--accent); }
.facts { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 0; margin: 0; list-style: none; font: 500 12px/1.4 var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }

/* panel upload */
.tool { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 16px; scroll-margin-top: 16px; }
.slots { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.slot { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.slot-head { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.step { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 700 12px/1 var(--f-mono); }
.slot-head h3 { font-size: 16px; font-weight: 700; }
.slot-head .clear { margin-left: auto; border: 0; background: none; color: var(--muted); font: 600 13px var(--f-body); cursor: pointer; padding: 4px 6px; text-decoration: underline; text-underline-offset: 3px; }
.drop {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  min-height: 190px; padding: 12px; text-align: center; overflow: hidden; cursor: pointer;
  border: 1.5px dashed var(--line); border-radius: 12px; background: var(--bg); color: var(--muted);
}
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.drop { -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
.drop.has { border-style: solid; }
.drop svg { color: var(--accent); }
.drop-body { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 13px; }
.drop-body strong { color: var(--fg); font-size: 15px; }
.thumb { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.drop-meta { position: absolute; left: 6px; right: 6px; bottom: 6px; display: flex; flex-direction: column; gap: 1px; padding: 6px 8px; border-radius: 8px; background: var(--chip-bg); color: var(--chip-fg); font: 500 11px/1.35 var(--f-mono); text-align: left; }
.drop-meta span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.actions .btn-primary { flex: 1 1 100%; font-size: 16px; min-height: 48px; }
.hint { font-size: 14px; color: var(--muted); min-height: 21px; }
.hint.err { color: var(--danger); }

/* viewer */
.viewer { display: flex; flex-direction: column; gap: 12px; min-width: 0; scroll-margin-top: 16px; }
.viewer-head { display: flex; align-items: center; gap: 10px; }
.viewer-head h2 { font-size: 22px; font-weight: 700; }
.pill { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em; padding: 6px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
.cmp {
  --pos: 50%; --ar: 0.564;
  position: relative; width: min(100%, calc(78vh * var(--ar))); aspect-ratio: var(--ar);
  margin-inline: auto; overflow: hidden; border-radius: 12px; background: var(--surface-2);
  touch-action: pan-y; cursor: ew-resize; user-select: none; -webkit-user-select: none;
}
.cmp img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; pointer-events: none; -webkit-user-drag: none; }
.before-clip { position: absolute; inset: 0; clip-path: inset(0 calc(100% - var(--pos)) 0 0); }
.divider { position: absolute; top: 0; bottom: 0; left: var(--pos); width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.25), 0 0 14px rgba(0,0,0,0.4); pointer-events: none; }
.knob {
  position: absolute; top: 50%; left: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
  background: #fff; color: #111827; display: grid; place-items: center; pointer-events: auto; cursor: grab;
  box-shadow: 0 2px 12px rgba(0,0,0,0.45);
}
.knob:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.chip { position: absolute; top: 12px; padding: 6px 10px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-fg); font: 500 12px/1 var(--f-mono); letter-spacing: 0.06em; text-transform: uppercase; pointer-events: none; transition: opacity 0.2s; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.chip-l { left: 12px; } .chip-r { right: 12px; }
.cmp.hide-l .chip-l, .cmp.hide-r .chip-r { opacity: 0; }
.cmp:fullscreen { position: fixed; inset: 0; margin: auto; width: min(100vw, calc(100vh * var(--ar))); height: auto; max-height: 100vh; border-radius: 0; }
.cmp.zoomed { touch-action: none; cursor: grab; }
.cmp.zoomed.panning { cursor: grabbing; }
.cmp img { transform-origin: 50% 50%; will-change: transform; }
.zoom-pill { position: absolute; left: 12px; bottom: 12px; padding: 5px 9px; border-radius: 999px; background: var(--chip-bg); color: var(--chip-fg); font: 500 12px/1 var(--f-mono); pointer-events: none; }
.viewer-tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--surface); }
.seg button { min-height: 44px; padding: 8px 14px; border: 0; background: transparent; color: var(--fg); font: 600 14px var(--f-body); cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button:hover { background: var(--accent-soft); }
.viewer-note { font-size: 14px; color: var(--muted); text-align: center; max-width: 60ch; margin-inline: auto; }

/* section umum */
section.block { padding-top: 72px; scroll-margin-top: 8px; }
.sec-head { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; max-width: 62ch; }
.sec-head h2 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; line-height: 1.1; }
.sec-head p { color: var(--muted); }
.tag { align-self: flex-start; font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 6px 9px; }

/* alat HD dan hapus background */
.tools { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
@media (min-width: 900px) { .tools { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); align-items: start; } }
.card { display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); min-width: 0; }
.card h3 { font-size: 22px; font-weight: 700; }
.card > p { color: var(--muted); font-size: 15px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label, .field .lab { font: 600 14px var(--f-body); display: flex; justify-content: space-between; gap: 8px; }
.field output { font: 500 13px var(--f-mono); color: var(--muted); }
.field input[type="range"] { width: 100%; accent-color: var(--accent); min-height: 32px; }
.hd-row { display: flex; flex-wrap: wrap; gap: 8px; }
.hd-out { display: flex; flex-direction: column; gap: 10px; }
.hd-out canvas { display: block; max-width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.hd-info { font: 500 12px/1.5 var(--f-mono); color: var(--muted); }
.hd-pick { min-height: 56px; border: 1.5px dashed var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); font: 600 15px var(--f-body); cursor: pointer; padding: 10px 14px; text-align: left; }
.hd-pick:hover { border-color: var(--accent); background: var(--accent-soft); }
.links { display: flex; flex-direction: column; gap: 8px; }
.links a { display: flex; flex-direction: column; gap: 2px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); text-decoration: none; }
.links a:hover { border-color: var(--accent); }
.links a b { font-weight: 700; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.links a span { color: var(--muted); font-size: 14px; }
.links .sub { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-top: 6px; }

/* galeri */
.shot { margin: 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.shot button { display: block; width: 100%; padding: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface-2); cursor: zoom-in; }
.shot img { display: block; width: 100%; height: auto; }
.shot figcaption { font-size: 14px; color: var(--muted); }
.shot figcaption b { color: var(--fg); font-weight: 600; }
.g-pair { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-bottom: 16px; }
.g-hd { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.g-hd .shot img { aspect-ratio: 4 / 5; object-fit: cover; }
@media (max-width: 640px) { .g-pair { grid-template-columns: minmax(0, 1fr); } .g-hd { gap: 8px; } .g-hd figcaption { font-size: 12px; } }

/* promosi */
.promo { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
@media (min-width: 520px) { .promo { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 900px) { .promo { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.app { display: flex; flex-direction: column; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-decoration: none; min-width: 0; }
.app:hover { border-color: var(--accent); }
.app .kind { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
.app h3 { font-size: 22px; font-weight: 700; }
.app p { color: var(--muted); font-size: 15px; flex: 1; }
.app .go { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
.more-note { margin-top: 14px; color: var(--muted); font-size: 14px; }

/* AI */
.ai { display: grid; grid-template-columns: minmax(0, 1fr); gap: 24px; padding: 28px 20px; border-radius: 16px; background: var(--surface-2); }
@media (min-width: 820px) { .ai { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); padding: 36px; align-items: center; } }
.ai h2 { font-size: clamp(26px, 4vw, 36px); font-weight: 800; line-height: 1.1; margin-bottom: 10px; }
.ai p { color: var(--muted); max-width: 48ch; margin-bottom: 18px; }
.ai .btn-primary { min-height: 52px; padding-inline: 22px; font-size: 16px; }
.prompts { display: flex; flex-direction: column; gap: 8px; }
.prompts small { font: 500 11px/1 var(--f-mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.prompts button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 48px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); text-align: left; font: 500 16px/1.3 var(--f-body); cursor: pointer; }
.prompts button:hover { border-color: var(--accent); }
.prompts button svg { flex: none; color: var(--accent); }

/* Faisal AI */
.fab { position: fixed; z-index: 40; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: inline-flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 18px 0 14px; border: 0; border-radius: 999px;
  background: var(--accent); color: var(--on-accent); font: 700 15px var(--f-body); cursor: pointer; box-shadow: 0 8px 24px rgba(10, 20, 60, 0.35); }
.fab:hover { filter: brightness(1.08); }
.chat { position: fixed; z-index: 45; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  width: min(400px, calc(100vw - 32px)); height: min(620px, calc(100vh - 32px)); height: min(620px, calc(100dvh - 32px));
  display: flex; flex-direction: column; background: var(--surface); color: var(--fg); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
  box-shadow: 0 16px 48px rgba(5, 10, 30, 0.35); }
@media (max-width: 520px) {
  .chat { left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); bottom: 0; width: auto; height: min(84vh, 680px); height: min(84dvh, 680px);
    border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); }
}
.chat-head { display: flex; align-items: center; gap: 10px; padding: 12px 12px 12px 14px; border-bottom: 1px solid var(--line); }
.chat-head img { width: 36px; height: 36px; border-radius: 10px; flex: none; }
.chat-head .who { min-width: 0; flex: 1; }
.chat-head strong { display: block; font: 700 16px/1.2 var(--f-display); }
.chat-head span { display: block; font-size: 12px; color: var(--muted); line-height: 1.3; }
.chat-head button { width: 40px; height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.chat-head button:hover { background: var(--surface-2); color: var(--fg); }
.chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; overscroll-behavior: contain; }
.msg { max-width: 86%; padding: 10px 13px; border-radius: 14px; font-size: 15px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.bot { align-self: flex-start; background: var(--surface-2); border-bottom-left-radius: 4px; }
.msg.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
.msg.typing { color: var(--muted); }
.msg.err { background: transparent; border: 1px dashed var(--line); color: var(--muted); font-size: 14px; }
.chat-chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 14px 10px; }
.chat-chips button { min-height: 36px; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--fg); font: 500 13px var(--f-body); cursor: pointer; }
.chat-chips button:hover { border-color: var(--accent); }
.chat-form { display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px; border-top: 1px solid var(--line); }
.chat-form textarea { flex: 1; min-width: 0; resize: none; max-height: 112px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); font: 400 16px/1.4 var(--f-body); }
.chat-form textarea::placeholder { color: var(--muted); }
.chat-form button { flex: none; width: 4
